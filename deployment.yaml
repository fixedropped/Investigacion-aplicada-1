apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-php-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: login-php
  template:
    metadata:
      labels:
        app: login-php
    spec:
      containers:
      - name: login-php
        image: login-php:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80